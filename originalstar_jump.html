<script>
// ============================================================
// 星穹跳跃 - Star Jump
// A vertical platform jumper set in space
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Resize ---
function resizeCanvas() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = Math.min(w, 480);
  canvas.height = h;
  canvas.style.margin = '0 auto';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// Audio System (Web Audio API - simple beeps)
// ============================================================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

function playTone(freq, duration, type, vol) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.1;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function sfxJump() { playTone(520, 0.12, 'square', 0.06); }
function sfxStar() { playTone(880, 0.15, 'sine', 0.08); playTone(1100, 0.1, 'sine', 0.05); }
function sfxLand() { playTone(330, 0.08, 'triangle', 0.05); }
function sfxSpring() { playTone(660, 0.2, 'sine', 0.08); }
function sfxBreak() { playTone(200, 0.15, 'sawtooth', 0.04); }
function sfxGameOver() { playTone(200, 0.3, 'sawtooth', 0.06); playTone(150, 0.4, 'sawtooth', 0.04); }

// ============================================================
// Game State
// ============================================================
const GameState = { MENU: 0, PLAYING: 1, GAME_OVER: 2 };
let state = GameState.MENU;
let score = 0;
let highScore = parseInt(localStorage.getItem('starJumpHighScore')) || 0;
let starsCollected = 0;
let frameCount = 0;
let gameTime = 0;
let difficulty = 1;
let screenShake = 0;
let comboCount = 0;

// ============================================================
// Particles
// ============================================================
let particles = [];
let floatingStars = [];

class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color;
    this.size = size || 3;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.02;
    this.life--;
    return this.life > 0;
  }
  draw(ctx) {
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class FloatingStar {
  constructor(w, h) {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.size = Math.random() * 2 + 0.5;
    this.speed = Math.random() * 0.3 + 0.1;
    this.alpha = Math.random() * 0.5 + 0.1;
    this.twinkleSpeed = Math.random() * 0.02 + 0.005;
    this.twinklePhase = Math.random() * Math.PI * 2;
  }
  draw(ctx, offsetY) {
    const a = this.alpha + Math.sin(frameCount * this.twinkleSpeed + this.twinklePhase) * 0.15;
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, ((this.y + offsetY * 0.1) % canvas.height + canvas.height) % canvas.height, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// Platform Types
// ============================================================
const PLATFORM_TYPES = {
  NORMAL: 'normal',
  MOVING: 'moving',
  FRAGILE: 'fragile',
  SPRING: 'spring'
};

// ============================================================
// Player
// ============================================================
let player = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  width: 24,
  height: 28,
  onGround: false,
  jumping: false,
  jumpCount: 0,
  maxJumps: 1,
  trail: [],
  angle: 0,
  glowIntensity: 0
};

// ============================================================
// Platforms
// ============================================================
let platforms = [];
const PLATFORM_WIDTH = 72;
const PLATFORM_HEIGHT = 14;
const PLATFORM_GAP = 70;

// ============================================================
// Stars (collectibles)
// ============================================================
let collectibles = [];

// ============================================================
// Initialization
// ============================================================
let cameraY = 0;
let worldHeight = 0;

function initGame() {
  player.x = canvas.width / 2;
  player.y = canvas.height * 0.7;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.jumping = false;
  player.jumpCount = 0;
  player.trail = [];
  player.angle = 0;
  player.glowIntensity = 0;

  score = 0;
  starsCollected = 0;
  gameTime = 0;
  difficulty = 1;
  screenShake = 0;
  comboCount = 0;
  cameraY = 0;
  worldHeight = 0;
  particles = [];
  platforms = [];
  collectibles = [];

  // Generate initial platforms
  const startY = player.y + player.height / 2 + 30;  // 脚底往下30px
  for (let i = 0; i < 12; i++) {
    const y = startY - i * PLATFORM_GAP;  // 往上延伸（y减小）
    let x;
    if (i === 0) {
      // 第一块平台直接放在玩家正下方
      x = player.x;
    } else {
      x = 40 + Math.random() * (canvas.width - 120);
      // 第二块平台靠近玩家，确保不掉空
      if (i === 1) x = Math.max(30, Math.min(canvas.width - 80, player.x + (Math.random() - 0.5) * 100));
    }
    let type = PLATFORM_TYPES.NORMAL;
    if (i > 3) {
      const r = Math.random();
      if (r < 0.12) type = PLATFORM_TYPES.MOVING;
      else if (r < 0.2) type = PLATFORM_TYPES.FRAGILE;
      else if (r < 0.26) type = PLATFORM_TYPES.SPRING;
    }
    platforms.push(createPlatform(x, y, type));
    if (i > 0 && i % 3 === 0 && Math.random() < 0.5) {
      collectibles.push({
        x: x + Math.random() * 60 - 30,
        y: y - 30,
        collected: false,
        bobPhase: Math.random() * Math.PI * 2,
        size: 10
      });
    }
  }
  worldHeight = platforms[platforms.length - 1].y;

  // Generate floating background stars
  floatingStars = [];
  for (let i = 0; i < 80; i++) {
    floatingStars.push(new FloatingStar(canvas.width, canvas.height));
  }
}

function createPlatform(x, y, type) {
  let moveRange = 0;
  let moveSpeed = 0;
  let moveDir = 1;
  let origX = x;
  if (type === PLATFORM_TYPES.MOVING) {
    moveRange = 40 + Math.random() * 40;
    moveSpeed = 0.5 + Math.random() * 0.5;
  }
  return {
    x, y, w: PLATFORM_WIDTH, h: PLATFORM_HEIGHT,
    type, origX, moveRange, moveSpeed, moveDir,
    broken: false,
    breakTimer: 0,
    springBounce: 1.5
  };
}

// ============================================================
// Input
// ============================================================
const keys = {};
let touchLeft = false;
let touchRight = false;
let touchJump = false;

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
    e.preventDefault();
    if (state === GameState.MENU) startGame();
    else if (state === GameState.PLAYING) tryJump();
  }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') e.preventDefault();
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

function handleTouchStart(e) {
  e.preventDefault();
  initAudio();
  if (state === GameState.MENU) { startGame(); return; }
  if (state === GameState.GAME_OVER) return;
  const touches = e.touches;
  for (let t of touches) {
    const rect = canvas.getBoundingClientRect();
    const tx = t.clientX - rect.left;
    const ty = t.clientY - rect.top;
    const cx = canvas.width / 2;
    if (tx < cx - 20) touchLeft = true;
    else if (tx > cx + 20) touchRight = true;
    else { touchJump = true; tryJump(); }
  }
}

function handleTouchMove(e) {
  e.preventDefault();
  if (state !== GameState.PLAYING) return;
  touchLeft = false;
  touchRight = false;
  touchJump = false;
  const touches = e.touches;
  for (let t of touches) {
    const rect = canvas.getBoundingClientRect();
    const tx = t.clientX - rect.left;
    const ty = t.clientY - rect.top;
    const cx = canvas.width / 2;
    if (tx < cx - 20) touchLeft = true;
    else if (tx > cx + 20) touchRight = true;
    else { touchJump = true; }
  }
}

function handleTouchEnd(e) {
  e.preventDefault();
  touchLeft = false;
  touchRight = false;
  touchJump = false;
}

// Mouse click on canvas for jump
canvas.addEventListener('mousedown', e => {
  initAudio();
  if (state === GameState.MENU) { startGame(); return; }
  if (state === GameState.PLAYING) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const cx = canvas.width / 2;
    if (Math.abs(mx - cx) < 40) tryJump();
  }
});

// ============================================================
// Game Actions
// ============================================================
function startGame() {
  initAudio();
  initGame();
  state = GameState.PLAYING;
  document.getElementById('start-screen').classList.remove('active');
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('scoreDisplay').classList.add('active');
  document.getElementById('starCount').classList.add('active');
}

function tryJump() {
  if (player.onGround || player.jumpCount < player.maxJumps) {
    const jumpForce = player.onGround ? -9.5 : -8;
    player.vy = jumpForce;
    player.onGround = false;
    player.jumping = true;
    player.jumpCount++;
    sfxJump();
    // Spawn jump particles
    for (let i = 0; i < 6; i++) {
      particles.push(new Particle(
        player.x, player.y + player.height / 2,
        (Math.random() - 0.5) * 3, Math.random() * 2 + 1,
        20, '#64c8ff', 3
      ));
    }
  }
}

function gameOver() {
  state = GameState.GAME_OVER;
  sfxGameOver();
  screenShake = 10;

  // Spawn death particles
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(
      player.x, player.y,
      (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6,
      40, ['#64c8ff','#a78bfa','#f472b6','#fbbf24'][Math.floor(Math.random()*4)],
      4
    ));
  }

  document.getElementById('scoreDisplay').classList.remove('active');
  document.getElementById('starCount').classList.remove('active');

  const finalScore = Math.floor(score);
  document.getElementById('finalScore').textContent = finalScore + 'm';
  document.getElementById('finalStars').textContent = '⭐ 收集 ' + starsCollected + ' 颗星';

  const isNewRecord = finalScore > highScore;
  if (isNewRecord) {
    highScore = finalScore;
    localStorage.setItem('starJumpHighScore', highScore.toString());
    document.getElementById('newRecord').style.display = 'block';
  } else {
    document.getElementById('newRecord').style.display = 'none';
  }
  document.getElementById('highScore').innerHTML = '🏆 最高 <span class="high-score-label">' + highScore + 'm</span>';

  document.getElementById('gameover-screen').classList.add('active');
  setTimeout(() => { document.getElementById('gameover-screen').style.animation = 'none'; }, 100);
}

// ============================================================
// Physics & Update
// ============================================================
const GRAVITY = 0.45;
const MAX_FALL_SPEED = 12;
const MOVE_SPEED = 0.45;
const FRICTION = 0.85;
const MAX_MOVE_SPEED = 5;

function update() {
  frameCount++;
  gameTime++;

  if (state === GameState.MENU) {
    // Animate floating stars
    floatingStars.forEach(s => s.twinklePhase += 0.01);
    return;
  }

  if (state === GameState.GAME_OVER) {
    // Update particles
    particles = particles.filter(p => p.update());
    floatingStars.forEach(s => s.twinklePhase += 0.01);
    if (screenShake > 0) screenShake *= 0.9;
    if (screenShake < 0.1) screenShake = 0;
    return;
  }

  // --- Difficulty scaling ---
  difficulty = 1 + Math.floor(score / 300) * 0.15;

  // --- Player Input ---
  let moveX = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'] || touchLeft) moveX = -1;
  if (keys['ArrowRight'] || keys['d'] || keys['D'] || touchRight) moveX = 1;

  player.vx += moveX * MOVE_SPEED;
  player.vx *= FRICTION;
  if (Math.abs(player.vx) > MAX_MOVE_SPEED) player.vx = Math.sign(player.vx) * MAX_MOVE_SPEED;

  // --- Gravity ---
  player.vy += GRAVITY;
  if (player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;

  // --- Move Player ---
  player.x += player.vx;
  player.y += player.vy;

  // Wrap horizontally
  if (player.x < -player.width) player.x = canvas.width + player.width;
  if (player.x > canvas.width + player.width) player.x = -player.width;

  // --- Player trail ---
  player.trail.push({ x: player.x, y: player.y, life: 15 });
  if (player.trail.length > 20) player.trail.shift();
  player.trail.forEach(t => t.life--);
  player.trail = player.trail.filter(t => t.life > 0);

  // --- Player rotation ---
  player.angle = player.vx * 0.06;

  // --- Platform Collision ---
  player.onGround = false;
  const playerBottom = player.y + player.height / 2;
  const playerTop = player.y - player.height / 2;
  const playerLeft = player.x - player.width / 2;
  const playerRight = player.x + player.width / 2;

  for (let p of platforms) {
    if (p.broken) continue;
    // Update moving platforms
    if (p.type === PLATFORM_TYPES.MOVING) {
      p.x += p.moveSpeed * p.moveDir;
      if (p.x > p.origX + p.moveRange || p.x < p.origX - p.moveRange) p.moveDir *= -1;
    }

    // Collision check (only when falling)
    if (player.vy >= 0) {
      const pLeft = p.x - p.w / 2;
      const pRight = p.x + p.w / 2;
      const pTop = p.y - p.h / 2;
      const pBottom = p.y + p.h / 2;

      // Check if player is within horizontal range
      if (playerRight > pLeft && playerLeft < pRight) {
        // Check if player's bottom is within the platform top area
        const prevBottom = playerBottom - player.vy;
        if (prevBottom <= pTop + 4 && playerBottom >= pTop) {
          player.y = pTop - player.height / 2;
          player.vy = 0;
          player.onGround = true;
          player.jumping = false;
          player.jumpCount = 0;

          if (p.type === PLATFORM_TYPES.SPRING) {
            player.vy = -14;
            player.onGround = false;
            sfxSpring();
            // Spring particles
            for (let i = 0; i < 10; i++) {
              particles.push(new Particle(
                player.x, pTop,
                (Math.random() - 0.5) * 5, -Math.random() * 4 - 2,
                25, '#4ade80', 4
              ));
            }
          }

          if (p.type === PLATFORM_TYPES.FRAGILE) {
            p.broken = true;
            p.breakTimer = 10;
            sfxBreak();
            // Break particles
            for (let i = 0; i < 8; i++) {
              particles.push(new Particle(
                p.x, p.y,
                (Math.random() - 0.5) * 4, -Math.random() * 3,
                20, '#fb923c', 3
              ));
            }
          } else {
            sfxLand();
            // Landing particles
            for (let i = 0; i < 3; i++) {
              particles.push(new Particle(
                player.x, pTop,
                (Math.random() - 0.5) * 2, -Math.random() * 1,
                12, 'rgba(255,255,255,0.5)', 2
              ));
            }
          }

          // Score for landing on new platform
          const heightBonus = Math.max(0, Math.floor((pTop - worldHeight) / 10));
          if (heightBonus > 0) {
            score += heightBonus;
            comboCount = Math.min(comboCount + 1, 5);
          }
          break;
        }
      }
    }
  }

  // --- Fragile platform break animation ---
  for (let p of platforms) {
    if (p.broken && p.breakTimer > 0) {
      p.breakTimer--;
      if (p.breakTimer <= 0) {
        // Remove platform
      }
    }
  }
  platforms = platforms.filter(p => !p.broken || p.breakTimer > 0);

  // --- Score update (height) ---
  const currentHeight = Math.max(0, Math.floor((canvas.height - player.y) / 2));
  if (currentHeight > score) score = currentHeight;

  // --- Camera ---
  const targetCameraY = player.y - canvas.height * 0.35;
  cameraY += (targetCameraY - cameraY) * 0.08;

  // --- Generate new platforms above ---
  worldHeight = Math.min(worldHeight, platforms[platforms.length - 1]?.y || 0);
  while (platforms.length < 15) {
    const lastY = platforms.length > 0 ? platforms[platforms.length - 1].y : -100;
    const newY = lastY - PLATFORM_GAP - Math.random() * 20 * difficulty;
    const newX = 30 + Math.random() * (canvas.width - 100);
    let type = PLATFORM_TYPES.NORMAL;
    const r = Math.random();
    if (r < 0.1 * difficulty) type = PLATFORM_TYPES.MOVING;
    else if (r < 0.18 * difficulty) type = PLATFORM_TYPES.FRAGILE;
    else if (r < 0.22 * difficulty) type = PLATFORM_TYPES.SPRING;
    platforms.push(createPlatform(newX, newY, type));
    worldHeight = Math.min(worldHeight, newY);

    // Maybe add a collectible star
    if (Math.random() < 0.35) {
      collectibles.push({
        x: newX + (Math.random() - 0.5) * 60,
        y: newY - 30,
        collected: false,
        bobPhase: Math.random() * Math.PI * 2,
        size: 10
      });
    }
  }

  // --- Remove off-screen platforms ---
  platforms = platforms.filter(p => p.y < cameraY + canvas.height + 100 && p.y > cameraY - 200);

  // --- Collectible Stars ---
  for (let c of collectibles) {
    if (c.collected) continue;
    c.bobPhase += 0.04;
    const bobY = c.y + Math.sin(c.bobPhase) * 3;
    const dx = player.x - c.x;
    const dy = (player.y - player.height / 2) - bobY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 25) {
      c.collected = true;
      starsCollected++;
      score += 25;
      sfxStar();
      // Star particles
      for (let i = 0; i < 12; i++) {
        particles.push(new Particle(
          c.x, bobY,
          (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5,
          30, '#fbbf24', 3
        ));
      }
    }
  }

  collectibles = collectibles.filter(c => !c.collected || c.y > cameraY - 50);

  // --- Remove out-of-range collectibles ---
  collectibles = collectibles.filter(c => c.y < cameraY + canvas.height + 50);

  // --- Game Over Check (screen-space,不受相机延迟影响) ---
  const screenY = player.y - cameraY;
  if (screenY > canvas.height + 60) {
    gameOver();
  }

  // --- Update particles ---
  particles = particles.filter(p => p.update());

  // --- Screen shake decay ---
  if (screenShake > 0) screenShake *= 0.9;
  if (screenShake < 0.1) screenShake = 0;

  // --- Player glow ---
  player.glowIntensity = player.onGround ? 0.3 : 0.6;

  // --- Update UI ---
  document.getElementById('scoreValue').textContent = Math.floor(score) + 'm';
  document.getElementById('starCount').textContent = '⭐ ' + starsCollected;
}

// ============================================================
// Rendering
// ============================================================
function draw() {
  ctx.save();

  // Screen shake
  if (screenShake > 0.5) {
    const sx = (Math.random() - 0.5) * screenShake * 2;
    const sy = (Math.random() - 0.5) * screenShake * 2;
    ctx.translate(sx, sy);
  }

  // --- Background ---
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0a0015');
  grad.addColorStop(0.3, '#0f0a2e');
  grad.addColorStop(0.6, '#1a0a3e');
  grad.addColorStop(0.8, '#0f1a3e');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

  // --- Nebula effects ---
  const nebulaAlpha = 0.03;
  ctx.globalAlpha = nebulaAlpha;
  const nebulaGrad = ctx.createRadialGradient(
    canvas.width * 0.3, canvas.height * 0.2, 0,
    canvas.width * 0.3, canvas.height * 0.2, canvas.width * 0.6
  );
  nebulaGrad.addColorStop(0, '#a78bfa');
  nebulaGrad.addColorStop(0.5, '#6366f1');
  nebulaGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = nebulaGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const nebulaGrad2 = ctx.createRadialGradient(
    canvas.width * 0.7, canvas.height * 0.7, 0,
    canvas.width * 0.7, canvas.height * 0.7, canvas.width * 0.5
  );
  nebulaGrad2.addColorStop(0, '#f472b6');
  nebulaGrad2.addColorStop(0.5, '#ec4899');
  nebulaGrad2.addColorStop(1, 'transparent');
  ctx.fillStyle = nebulaGrad2;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1;

  // --- Floating stars ---
  floatingStars.forEach(s => s.draw(ctx, cameraY));

  // --- Camera transform ---
  ctx.save();
  ctx.translate(0, -cameraY);

  // --- Platforms ---
  for (let p of platforms) {
    const px = p.x;
    const py = p.y;
    const pw = p.w;
    const ph = p.h;

    if (py < cameraY - 50 || py > cameraY + canvas.height + 50) continue;

    ctx.save();
    ctx.translate(px, py);

    // Platform glow
    let glowColor = 'rgba(100, 200, 255, 0.15)';
    let fillColor = 'rgba(100, 200, 255, 0.3)';
    let borderColor = '#64c8ff';

    if (p.type === PLATFORM_TYPES.MOVING) {
      glowColor = 'rgba(168, 85, 247, 0.15)';
      fillColor = 'rgba(168, 85, 247, 0.3)';
      borderColor = '#a855f7';
    } else if (p.type === PLATFORM_TYPES.FRAGILE) {
      glowColor = 'rgba(251, 146, 60, 0.15)';
      fillColor = 'rgba(251, 146, 60, 0.3)';
      borderColor = '#fb923c';
    } else if (p.type === PLATFORM_TYPES.SPRING) {
      glowColor = 'rgba(74, 222, 128, 0.15)';
      fillColor = 'rgba(74, 222, 128, 0.3)';
      borderColor = '#4ade80';
    }

    if (p.broken) {
      const alpha = p.breakTimer / 10;
      ctx.globalAlpha = alpha;
    }

    // Glow effect
    const glowRadius = pw * 0.8;
    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowRadius);
    glowGrad.addColorStop(0, glowColor);
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(-glowRadius, -glowRadius, glowRadius * 2, glowRadius * 2);

    // Platform body
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 1.5;
    const r = 7;
    ctx.beginPath();
    ctx.moveTo(-pw / 2 + r, -ph / 2);
    ctx.lineTo(pw / 2 - r, -ph / 2);
    ctx.quadraticCurveTo(pw / 2, -ph / 2, pw / 2, -ph / 2 + r);
    ctx.lineTo(pw / 2, ph / 2 - r);
    ctx.quadraticCurveTo(pw / 2, ph / 2, pw / 2 - r, ph / 2);
    ctx.lineTo(-pw / 2 + r, ph / 2);
    ctx.quadraticCurveTo(-pw / 2, ph / 2, -pw / 2, ph / 2 - r);
    ctx.lineTo(-pw / 2, -ph / 2 + r);
    ctx.quadraticCurveTo(-pw / 2, -ph / 2, -pw / 2 + r, -ph / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Inner highlight
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(-pw / 2 + 4, -ph / 2 + 2, pw - 8, ph / 2 - 3);

    // Special indicators
    if (p.type === PLATFORM_TYPES.SPRING) {
      // Arrow indicators
      ctx.fillStyle = 'rgba(74, 222, 128, 0.6)';
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.lineTo(-5, 2);
      ctx.lineTo(5, 2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(-4, -3);
      ctx.lineTo(4, -3);
      ctx.closePath();
      ctx.fill();
    }

    if (p.type === PLATFORM_TYPES.FRAGILE) {
      // Crack lines
      ctx.strokeStyle = 'rgba(251, 146, 60, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-6, -3);
      ctx.lineTo(-2, 1);
      ctx.lineTo(-4, 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(3, -2);
      ctx.lineTo(6, 2);
      ctx.lineTo(4, 5);
      ctx.stroke();
    }

    ctx.restore();
  }

  // --- Collectible Stars ---
  for (let c of collectibles) {
    if (c.collected) continue;
    if (c.y < cameraY - 50 || c.y > cameraY + canvas.height + 50) continue;

    const bobY = c.y + Math.sin(c.bobPhase) * 3;
    const s = c.size + Math.sin(c.bobPhase * 0.5) * 1;

    ctx.save();
    ctx.translate(c.x, bobY);

    // Star glow
    const starGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 2.5);
    starGlow.addColorStop(0, 'rgba(251, 191, 36, 0.3)');
    starGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = starGlow;
    ctx.beginPath();
    ctx.arc(0, 0, s * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Star shape
    ctx.fillStyle = '#fbbf24';
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
      const outerX = Math.cos(angle) * s;
      const outerY = Math.sin(angle) * s;
      if (i === 0) ctx.moveTo(outerX, outerY);
      else ctx.lineTo(outerX, outerY);
      const innerAngle = angle + Math.PI / 5;
      const innerX = Math.cos(innerAngle) * s * 0.4;
      const innerY = Math.sin(innerAngle) * s * 0.4;
      ctx.lineTo(innerX, innerY);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Sparkle
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(-s * 0.25, -s * 0.3, s * 0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // --- Player Trail ---
  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    const alpha = (t.life / 15) * 0.3;
    const size = 3 * (t.life / 15);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#64c8ff';
    ctx.beginPath();
    ctx.arc(t.x, t.y + player.height / 2, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- Player ---
  const px = player.x;
  const py = player.y;

  // Player glow
  const playerGlow = ctx.createRadialGradient(px, py, 0, px, py, 30);
  playerGlow.addColorStop(0, `rgba(100, 200, 255, ${player.glowIntensity * 0.3})`);
  playerGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = playerGlow;
  ctx.beginPath();
  ctx.arc(px, py, 30, 0, Math.PI * 2);
  ctx.fill();

  // Player body (a cute spaceship/astronaut)
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(player.angle);

  // Body
  const bodyGrad = ctx.createLinearGradient(-player.width/2, -player.height/2, player.width/2, player.height/2);
  bodyGrad.addColorStop(0, '#64c8ff');
  bodyGrad.addColorStop(0.5, '#a78bfa');
  bodyGrad.addColorStop(1, '#f472b6');
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;

  // Rounded rectangle body
  const bw = player.width;
  const bh = player.height;
  const br = 8;
  ctx.beginPath();
  ctx.moveTo(-bw / 2 + br, -bh / 2);
  ctx.lineTo(bw / 2 - br, -bh / 2);
  ctx.quadraticCurveTo(bw / 2, -bh / 2, bw / 2, -bh / 2 + br);
  ctx.lineTo(bw / 2, bh / 2 - br);
  ctx.quadraticCurveTo(bw / 2, bh / 2, bw / 2 - br, bh / 2);
  ctx.lineTo(-bw / 2 + br, bh / 2);
  ctx.quadraticCurveTo(-bw / 2, bh / 2, -bw / 2, bh / 2 - br);
  ctx.lineTo(-bw / 2, -bh / 2 + br);
  ctx.quadraticCurveTo(-bw / 2, -bh / 2, -bw / 2 + br, -bh / 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Visor/face
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, -2, bw * 0.3, bh * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.ellipse(2, -3, bw * 0.12, bh * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Jet particles (when falling)
  if (player.vy > 2) {
    for (let i = 0; i < 2; i++) {
      particles.push(new Particle(
        px + (Math.random() - 0.5) * 8,
        py + bh / 2 + 2,
        (Math.random() - 0.5) * 1.5,
        Math.random() * 2 + 1,
        15,
        'rgba(100, 200, 255, 0.6)',
        2
      ));
    }
  }

  ctx.restore();

  ctx.restore(); // Camera transform

  ctx.restore(); // Screen shake

  // --- Particles (on screen space) ---
  for (let p of particles) {
    const screenY = p.y - cameraY;
    if (screenY > -10 && screenY < canvas.height + 10) {
      p.draw(ctx);
    }
  }
}

// ============================================================
// Game Loop
// ============================================================
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// UI Event Listeners
// ============================================================
document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  startGame();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  initAudio();
  document.getElementById('gameover-screen').style.animation = 'none';
  startGame();
});
document.getElementById('menuBtn').addEventListener('click', () => {
  state = GameState.MENU;
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('start-screen').classList.add('active');
  document.getElementById('scoreDisplay').classList.remove('active');
  document.getElementById('starCount').classList.remove('active');
});

// ============================================================
// Start
// ============================================================
initGame();
gameLoop();
</script>
